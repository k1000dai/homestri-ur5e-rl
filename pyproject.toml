[project]
name = "homestri"
version = "0.2.0"
description = "MuJoCo UR5e + Robotiq 2F-85 pick-and-place environments for VLA experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.0",
    "mujoco>=3.2",
    "numpy>=1.24",
]

[dependency-groups]
dev = [
    "imageio[ffmpeg]>=2.31",
    "pre-commit>=3.5",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homestri"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
